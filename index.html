<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Be My Valentine? ❤️</title>
    <style>
        body {
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #fce4ec; /* Baby Pink */
            font-family: Arial, sans-serif;
            overflow: hidden;
        }

        .widget {
            background-color: white;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
            text-align: center;
            width: 350px;
            position: relative;
        }

        .main-img {
            width: 100%;
            height: 200px;
            object-fit: cover;
            border-radius: 10px;
            margin-bottom: 20px;
            background-color: #eee; /* Placeholder grey */
        }

        h1 {
            color: #ad1457; /* Darker Pink Text */
            font-size: 24px;
            margin-bottom: 30px;
        }

        .btn-container {
            display: flex;
            justify-content: center;
            gap: 20px;
        }

        button {
            padding: 12px 25px;
            font-size: 16px;
            border: see howne;
            border-radius: 50px;
            cursor: pointer;
            transition: transform 0.2s;
            font-weight: bold;
        }

        #yesBtn {
            background-color: #d81b60; /* Darker Pink */
            color: white;
        }

        #see howBtn {
            background-color: #d81b60; /* Darker Pink */
            color: white;
            position: absolute;
        }

        #yesBtn:hover {
            transform: scale(1.1);
        }
    </style>
</head>
<body>

    <div class="widget">
        <img src="5head.jpg" alt="Valentine" class="main-img">
        
        <h1>Will you be my valentine? ❤️</h1>

        <div class="btn-container">
            <button id="yesBtn" onclick="sayYes()">Yes</button>
            <button id="see howBtn" onmouseover="moveButton()">see how</button>
        </div>
    </div>

    <script>
        function sayYes() {
            // This clears the page and shows your message
            document.body.innerHTML = `
                <div style="text-align:center; font-family:Arial; color:#ad1457;">
                    <h1 style="font-size: 80px;">YAY! Not like you could say no hehe</h1>
                </div>`;
        }

        function moveButton() {
            const btn = document.getElementById('see howBtn');
            // Calculate random position within the screen
            const x = Math.random() * (window.innerWidth - btn.offsetWidth);
            const y = Math.random() * (window.innerHeight - btn.offsetHeight);
            
            btn.style.left = x + 'px';
            btn.style.top = y + 'px';
        }
    </script>

</body>
</html>
