<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Be My Valentine? ❤️</title>
    <style>
        body {
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #fce4ec; /* Baby Pink */
            font-family: Arial, sans-serif;
            overflow: hidden;
        }

        .widget {
            background-color: white;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
            text-align: center;
            width: 350px;
            position: relative;
            z-index: 10;
        }

        .main-img {
            width: 100%;
            height: auto;
            max-height: 250px;
            object-fit: cover;
            border-radius: 10px;
            margin-bottom: 20px;
        }

        h1 {
            color: #ad1457; /* Darker Pink Text */
            font-size: 24px;
            margin-bottom: 30px;
        }

        .btn-container {
            display: flex;
            justify-content: center;
            gap: 20px;
            align-items: center;
        }

        button {
            padding: 12px 25px;
            font-size: 16px;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            transition: transform 0.2s;
            font-weight: bold;
        }

        #yesBtn {
            background-color: #d81b60;
            color: white;
        }

        #noBtn {
            background-color: #d81b60;
            color: white;
            transition: 0.2s ease;
        }

        #yesBtn:hover {
            transform: scale(1.1);
        }

        .heart {
            position: fixed;
            color: #d81b60;
            font-size: 20px;
            user-select: none;
            pointer-events: none;
            z-index: 0;
            animation: float 4s linear forwards;
        }

        @keyframes float {
            0% { transform: translateY(100vh) rotate(0deg); opacity: 1; }
            100% { transform: translateY(-10vh) rotate(360deg); opacity: 0; }
        }

        .sparkle {
            position: absolute;
            width: 5px;
            height: 5px;
            background: white;
            border-radius: 50%;
            box-shadow: 0 0 10px 2px #fff, 0 0 20px 5px #ffeb3b;
            animation: sparkle-anim 1.5s infinite;
        }

        @keyframes sparkle-anim {
            0% { transform: scale(0); opacity: 0; }
            50% { transform: scale(1.2); opacity: 1; }
            100% { transform: scale(0); opacity: 0; }
        }
    </style>
</head>
<body>

    <div class="widget">
        <img src="dogwine.jpg" alt="Valentine" class="main-img">
        <h1>ni hao fine shyt, will u be my valentine? <3 </h1>
        <div class="btn-container">
            <button id="yesBtn" onclick="sayYes()">Yes</button>
            <button id="noBtn" onmouseover="moveButton()" style="position: relative;">see how?</button>
        </div>
    </div>

    <script>
        function sayYes() {
            document.body.innerHTML = `
            <div style="text-align:center; font-family:Arial; color:#ad1457; padding-top: 20vh; display: flex; flex-direction: column; align-items: center; gap: 20px;">
                <h1 style="font-size: 60px; margin: 0; z-index: 100;">YAY! not like you could say no hehe ✨</h1>
                <button onclick="location.reload()" 
                    style="padding: 12px 25px; background-color: #d81b60; color: white; border: 2px solid #ad1457; border-radius: 50px; cursor: pointer; font-weight: bold; font-size: 16px; z-index: 100;">
                    Back to Start
                </button>
            </div>`;

            // Add sparkles on Yes click
            for (let i = 0; i < 50; i++) {
                let sparkle = document.createElement("div");
                sparkle.className = "sparkle";
                sparkle.style.top = Math.random() * 100 + "vh";
                sparkle.style.left = Math.random() * 100 + "vw";
                sparkle.style.animationDelay = Math.random() * 2 + "s";
                document.body.appendChild(sparkle);
            }
        }

        function moveButton() {
            const btn = document.getElementById('noBtn');
            btn.style.position = 'absolute'; // This is what makes it "fly"

            const screenWidth = window.innerWidth;
            const screenHeight = window.innerHeight;

            const maxX = screenWidth - btn.offsetWidth - 100;
    const maxY = screenHeight - btn.offsetHeight - 100;

    // 3. Generate random spot, but FORCE it between 50px and the Max Safe spot
    let randomX = Math.floor(Math.random() * maxX);
    let randomY = Math.floor(Math.random() * maxY);

    // 4. The Failsafe: If the number is too small, make it 50. 
    // If it's too big, cap it at maxX.
    randomX = Math.max(50, Math.min(randomX, maxX));
    randomY = Math.max(50, Math.min(randomY, maxY));

            btn.style.left = randomX + 'px';
            btn.style.top = randomY + 'px';
        }

        function createHeart() {
            const heart = document.createElement('div');
            heart.classList.add('heart');
            heart.innerHTML = '😍';
            heart.style.left = Math.random() * 100 + "vw";
            heart.style.fontSize = Math.random() * 20 + 10 + "px";
            heart.style.animationDuration = Math.random() * 2 + 3 + "s";
            document.body.appendChild(heart);
            setTimeout(() => { heart.remove(); }, 5000);
        }

        setInterval(createHeart, 300);
    </script>
</body>
</html>
